# SonarCloud project settings.
# Project key and organization are set on sonarcloud.io after importing the repo.
# Verify these match what SonarCloud shows in your project settings.
sonar.projectKey=MacsiaProduction_DebtsApp
sonar.organization=macsia

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,backend/src/integrationTest/java,frontend/src
sonar.test.inclusions=**/*Test.java,**/*.test.js,**/*.test.jsx

sonar.java.binaries=backend/build/classes/java/main
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.exclusions=\
  **/node_modules/**,\
  **/build/**,\
  **/dist/**,\
  **/*.config.js,\
  **/configs/**,\
  **/dto/**,\
  **/exceptions/**,\
  **/*Application.java,\
  **/models/**

sonar.qualitygate.wait=true
