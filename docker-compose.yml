services:
  debts_bot_db:
    image: postgres:15-alpine
    container_name: debts_bot_db
    restart: always
    environment:
      - POSTGRES_USER=debtsbot
      - POSTGRES_PASSWORD=debtsbot
      - POSTGRES_DB=debtsbot
    ports:
      - '5432:5432'
    volumes:
      - debts_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debtsbot -d debtsbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  debts_neo4j:
    image: neo4j:5-community
    container_name: debts_neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/debtsbot123
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p debtsbot123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  debts_bot:
    container_name: debts_bot
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://debts_bot_db:5432/debtsbot
      - SPRING_DATASOURCE_USERNAME=debtsbot
      - SPRING_DATASOURCE_PASSWORD=debtsbot
      - SPRING_NEO4J_URI=bolt://debts_neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=debtsbot123
      - JWT_SECRET=debtsapp-local-dev-jwt-secret-change-me
      - TELEGRAM_BOT_ENABLED=false
    depends_on:
      debts_bot_db:
        condition: service_healthy
      debts_neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  debts_frontend:
    container_name: debts_frontend
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE: /api
        NGINX_API_UPSTREAM: debts_bot
    ports:
      - '3000:80'
    depends_on:
      debts_bot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  debts_data:
    external: false
  neo4j_data:
    external: false
