name: "CI: сборка и тесты"

on:
  push:
    branches: [ master, main, lab3, lab4 ]
  pull_request:
    branches: [ master, main, lab3, lab4 ]

jobs:
  backend-test:
    name: "Backend: unit-тесты"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend unit tests with coverage
        working-directory: backend
        run: ./gradlew test jacocoTestReport --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Backend unit-тесты"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  backend-build:
    name: "Backend: компиляция"
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile backend
        working-directory: backend
        run: ./gradlew classes --no-daemon

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Backend компиляция"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  backend-integration:
    name: "Backend: integration-тесты"
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend integration tests
        working-directory: backend
        run: ./gradlew integrationTest --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Backend integration-тесты"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  frontend-test:
    name: "Frontend: unit-тесты"
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend unit tests with coverage
        run: npm test -- --watchAll=false --coverage
        env:
          CI: "true"

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/coverage/

      - name: Upload frontend lcov report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lcov-report
          path: frontend/coverage/lcov.info

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Frontend unit-тесты"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  frontend-build:
    name: "Frontend: production-сборка"
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Frontend production-сборка"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  sonarqube-scan:
    name: "SonarCloud: анализ качества кода"
    runs-on: ubuntu-latest
    needs: [ backend-integration, frontend-test ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download JaCoCo coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/test/

      - name: Download frontend lcov coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-lcov-report
          path: frontend/coverage/

      - name: Compile backend classes (needed by sonar java bytecode analysis)
        working-directory: backend
        run: ./gradlew classes --no-daemon

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_URL }}

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "SonarCloud анализ"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  publish-images:
    name: "Docker: публикация образов в GHCR"
    if: ${{ github.event_name == 'push' && contains(fromJson('["refs/heads/master","refs/heads/main","refs/heads/lab3","refs/heads/lab4"]'), github.ref) }}
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - backend-integration
      - frontend-build
      - sonarqube-scan
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute backend image tags
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/debtsapp-backend
          tags: |
            type=sha
            type=raw,value=lab3,enable=${{ github.ref_name == 'lab3' }}
            type=raw,value=lab4,enable=${{ github.ref_name == 'lab4' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      - name: Compute frontend image tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/debtsapp-frontend
          tags: |
            type=sha
            type=raw,value=lab3,enable=${{ github.ref_name == 'lab3' }}
            type=raw,value=lab4,enable=${{ github.ref_name == 'lab4' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Docker публикация образов"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  update-argocd-image:
    name: "GitOps: обновить image tag для Argo CD"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'lab4'
    needs: [ publish-images ]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image SHA tags in Helm values
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          sed -i "s|^    tag: .*|    tag: sha-${SHORT}|g" infra/helm/debtsapp-app/values.yaml

      - name: Commit and push [skip ci]
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/debtsapp-app/values.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update image tag to sha-${GITHUB_SHA:0:7} [skip ci]"
          git push

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "GitOps image update"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
