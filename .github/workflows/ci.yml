name: "CI: сборка и тесты"

on:
  push:
    branches: [ master, main, lab3, lab4 ]
  pull_request:
    branches: [ master, main, lab3, lab4 ]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publish Docker images even if SonarQube gate fails'
        type: boolean
        default: false

env:
  SONAR_HOST_URL: ${{ vars.SONARQUBE_URL != '' && vars.SONARQUBE_URL || 'https://sonarcloud.io' }}

jobs:
  backend-test:
    name: "Backend: unit-тесты"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend unit tests with coverage
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Backend unit-тесты"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          details:   "Coverage below 80% or unit tests failed"

  backend-build:
    name: "Backend: компиляция"
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile backend
        working-directory: backend
        run: ./gradlew classes --no-daemon

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Backend компиляция"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  backend-integration:
    name: "Backend: integration-тесты"
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend integration tests
        working-directory: backend
        run: ./gradlew integrationTest --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Backend integration-тесты"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  frontend-test:
    name: "Frontend: unit-тесты"
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend unit tests with coverage
        run: npm test -- --watchAll=false --coverage
        env:
          CI: "true"

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/coverage/

      - name: Upload frontend lcov report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lcov-report
          path: frontend/coverage/lcov.info

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Frontend unit-тесты"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          details:   "Coverage below 80% or unit tests failed"

  frontend-build:
    name: "Frontend: production-сборка"
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Frontend production-сборка"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  sonarqube-scan:
    name: "SonarQube: анализ качества кода"
    runs-on: ubuntu-latest
    needs: [ backend-integration, frontend-test ]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download JaCoCo coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/test/

      - name: Download frontend lcov coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-lcov-report
          path: frontend/coverage/

      - name: Compile backend classes (needed by sonar java bytecode analysis)
        working-directory: backend
        run: ./gradlew classes --no-daemon

#        Временная проверка токена
      - name: Check project access
        run: |
          curl -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/projects/search?projects=MacsiaProduction_DebtsApp"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
#          Временная проверка для отладки
      - name: Debug scanner output
        run: |
          echo "PWD=$(pwd)"
          ls -la
          ls -la .scannerwork || true
          cat .scannerwork/report-task.txt || true

#      - name: SonarQube Quality Gate
#        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1
#        timeout-minutes: 5
#        env:
#          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
#          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
      - name: Check SonarCloud Quality Gate
        run: |
          set -e

          CE_TASK_URL=$(grep ceTaskUrl .scannerwork/report-task.txt | cut -d= -f2-)

          echo "Waiting for analysis..."
          while true; do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" "$CE_TASK_URL" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['task']['status'])")

            echo "CE status: $STATUS"

            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && exit 1

            sleep 5
          done

          GATE=$(curl -s -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=MacsiaProduction_DebtsApp" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['projectStatus']['status'])")

          echo "Quality Gate: $GATE"

          [ "$GATE" = "OK" ] || exit 1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Collect SonarQube gate details
        if: failure()
        id: sonar-gate
        run: |
          PROJECT_KEY="MacsiaProduction_DebtsApp"
          RESPONSE="$(curl -s -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" || echo '{}')"
          STATUS="$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('projectStatus',{}).get('status','UNKNOWN'))")"
          CONDITIONS="$(echo "$RESPONSE" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for c in d.get('projectStatus',{}).get('conditions',[]):
              print(f\"{c.get('metricKey')}: {c.get('actualValue')} (required {c.get('comparator')} {c.get('errorThreshold')}) -> {c.get('status')}\")
          ")"
          {
            echo "gate_status=${STATUS}"
            echo "gate_details<<EOF"
            echo "Quality Gate: ${STATUS}"
            echo "${CONDITIONS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "SonarCloud анализ"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          details:   ${{ steps.sonar-gate.outputs.gate_details }}

  publish-images:
    name: "Docker: публикация образов в GHCR"
    if: >-
      always() &&
      needs.backend-build.result == 'success' &&
      needs.backend-integration.result == 'success' &&
      needs.frontend-build.result == 'success' &&
      contains(fromJson('["refs/heads/master","refs/heads/main","refs/heads/lab3","refs/heads/lab4"]'), github.ref) &&
      (
        (github.event_name == 'push' && needs.sonarqube-scan.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.force_publish == true && github.ref_name == 'lab3')
      )
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - backend-integration
      - frontend-build
      - sonarqube-scan
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute backend image tags
        id: backend-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/debtsapp-backend
          tags: |
            type=sha
            type=raw,value=lab3,enable=${{ github.ref_name == 'lab3' }}
            type=raw,value=lab4,enable=${{ github.ref_name == 'lab4' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      - name: Compute frontend image tags
        id: frontend-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/debtsapp-frontend
          tags: |
            type=sha
            type=raw,value=lab3,enable=${{ github.ref_name == 'lab3' }}
            type=raw,value=lab4,enable=${{ github.ref_name == 'lab4' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Docker публикация образов"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  update-argocd-image:
    name: "GitOps: обновить image tag для Argo CD"
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(fromJson('["master","main","lab4"]'), github.ref_name) &&
      needs.publish-images.result == 'success'
    needs: [ publish-images ]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image SHA tags in Helm values
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          sed -i "s|^    tag: .*|    tag: sha-${SHORT}|g" infra/helm/debtsapp-app/values.yaml

      - name: Commit and push [skip ci]
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/debtsapp-app/values.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update image tag to sha-${GITHUB_SHA:0:7} [skip ci]"
          git push

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "GitOps image update"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  argocd-verify:
    name: "Argo CD: проверка CD sync"
    runs-on: ubuntu-latest
    needs: [ update-argocd-image ]
    if: needs.update-argocd-image.result == 'success'
    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve verification mode
        id: mode
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          if [ -z "${ARGOCD_AUTH_TOKEN}" ]; then
            echo "ARGOCD_AUTH_TOKEN is not set: skipping live CD verification"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Argo CD application sync
        if: steps.mode.outputs.enabled == 'true'
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          ARGOCD_SERVER="${ARGOCD_SERVER:-argocd.macsia.fun}"
          APP_URL="https://${ARGOCD_SERVER}/api/v1/applications/debtsapp"
          for attempt in $(seq 1 36); do
            BODY="$(curl -sf -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" "${APP_URL}")"
            HEALTH="$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin)['status']['health']['status'])")"
            SYNC="$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin)['status']['sync']['status'])")"
            echo "Attempt ${attempt}: health=${HEALTH} sync=${SYNC}"
            if [ "$HEALTH" = "Healthy" ] && [ "$SYNC" = "Synced" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Argo CD application did not become Healthy/Synced in time"
          exit 1

      - name: Verify application health endpoint
        if: steps.mode.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          APP_DOMAIN="${APP_DOMAIN:-debtsapp.macsia.fun}"
          curl --fail --silent --show-error --max-time 60 \
            "https://${APP_DOMAIN}/api/actuator/health"

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "Argo CD CD verify"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          details:   "Argo CD sync or app health check failed"

  pipeline-summary:
    name: "Pipeline: итог CI/CD"
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - backend-build
      - backend-integration
      - frontend-test
      - frontend-build
      - sonarqube-scan
      - publish-images
      - update-argocd-image
      - argocd-verify
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compose pipeline status
        id: summary
        run: |
          set -euo pipefail
          STATUS=success
          FAILED=""
          check() {
            local name="$1"
            local result="$2"
            case "$result" in
              failure|cancelled)
                STATUS=failure
                FAILED="${FAILED}${name} (${result}); "
                ;;
            esac
          }
          check "backend-test" "${{ needs.backend-test.result }}"
          check "backend-build" "${{ needs.backend-build.result }}"
          check "backend-integration" "${{ needs.backend-integration.result }}"
          check "frontend-test" "${{ needs.frontend-test.result }}"
          check "frontend-build" "${{ needs.frontend-build.result }}"
          check "sonarqube-scan" "${{ needs.sonarqube-scan.result }}"
          check "publish-images" "${{ needs.publish-images.result }}"
          check "update-argocd-image" "${{ needs.update-argocd-image.result }}"
          check "argocd-verify" "${{ needs.argocd-verify.result }}"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          {
            echo "details<<EOF"
            echo "backend-test: ${{ needs.backend-test.result }}"
            echo "backend-build: ${{ needs.backend-build.result }}"
            echo "backend-integration: ${{ needs.backend-integration.result }}"
            echo "frontend-test: ${{ needs.frontend-test.result }}"
            echo "frontend-build: ${{ needs.frontend-build.result }}"
            echo "sonarqube-scan: ${{ needs.sonarqube-scan.result }}"
            echo "publish-images: ${{ needs.publish-images.result }}"
            echo "update-argocd-image: ${{ needs.update-argocd-image.result }}"
            echo "argocd-verify: ${{ needs.argocd-verify.result }}"
            if [ -n "$FAILED" ]; then
              echo ""
              echo "Failed: ${FAILED}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram pipeline summary
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:   ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ steps.summary.outputs.status }}
          job_name:  "Pipeline summary"
          workflow:  ${{ github.workflow }}
          ref_name:  ${{ github.ref_name }}
          run_url:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          details:   ${{ steps.summary.outputs.details }}

      - name: Fail workflow when pipeline failed
        if: steps.summary.outputs.status == 'failure'
        run: exit 1
