name: "CI: сборка и тесты"

on:
  push:
    branches: [ master, main, lab3 ]
  pull_request:
    branches: [ master, main, lab3 ]

jobs:
  backend-test:
    name: "Backend: unit-тесты"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend unit tests
        working-directory: backend
        run: ./gradlew test --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload backend unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/

  backend-build:
    name: "Backend: компиляция"
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile backend
        working-directory: backend
        run: ./gradlew classes --no-daemon

  backend-integration:
    name: "Backend: integration-тесты"
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend integration tests
        working-directory: backend
        run: ./gradlew integrationTest --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  frontend-test:
    name: "Frontend: unit-тесты"
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"

      - name: Upload frontend unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/coverage/

  frontend-build:
    name: "Frontend: production-сборка"
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build

  publish-images:
    name: "Docker: публикация образов в GHCR"
    if: ${{ github.event_name == 'push' && contains(fromJson('["refs/heads/master","refs/heads/main","refs/heads/lab3"]'), github.ref) }}
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - backend-integration
      - frontend-build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute backend image tags
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/debtsapp-backend
          tags: |
            type=sha
            type=raw,value=lab3,enable=${{ github.ref_name == 'lab3' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      - name: Compute frontend image tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/debtsapp-frontend
          tags: |
            type=sha
            type=raw,value=lab3,enable=${{ github.ref_name == 'lab3' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
