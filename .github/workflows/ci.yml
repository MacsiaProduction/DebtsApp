name: "CI: сборка и тесты"

on:
  push:
    branches: [ master, main, lab2 ]
  pull_request:
    branches: [ master, main, lab2 ]

jobs:
  backend-test:
    name: "Backend: unit-тесты"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend unit tests
        working-directory: backend
        run: ./gradlew test --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload backend unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/

  backend-build:
    name: "Backend: сборка"
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile backend
        working-directory: backend
        run: ./gradlew classes --no-daemon

  backend-integration:
    name: "Backend: integration-тесты"
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend integration tests
        working-directory: backend
        run: ./gradlew integrationTest --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  frontend-test:
    name: "Frontend: unit-тесты"
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"

  frontend-build:
    name: "Frontend: production-сборка"
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build

  publish-images:
    name: "Docker: публикация образов в GHCR"
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lab2') }}
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - backend-integration
      - frontend-build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GHCR namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Prepare Docker image tags
        run: |
          backend_image="${IMAGE_NAMESPACE}/debtsapp-backend"
          frontend_image="${IMAGE_NAMESPACE}/debtsapp-frontend"

          {
            echo 'BACKEND_IMAGE_TAGS<<EOF'
            echo "${backend_image}:${GITHUB_SHA}"
            if [[ "${GITHUB_REF_NAME}" == "lab2" ]]; then
              echo "${backend_image}:lab2"
            fi
            if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
              echo "${backend_image}:latest"
            fi
            echo 'EOF'

            echo 'FRONTEND_IMAGE_TAGS<<EOF'
            echo "${frontend_image}:${GITHUB_SHA}"
            if [[ "${GITHUB_REF_NAME}" == "lab2" ]]; then
              echo "${frontend_image}:lab2"
            fi
            if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
              echo "${frontend_image}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE_TAGS }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE_TAGS }}
