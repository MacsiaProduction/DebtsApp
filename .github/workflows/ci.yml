name: "CI: сборка и тесты"

on:
  push:
    branches: [ master, main, lab3, lab4 ]
  pull_request:
    branches: [ master, main, lab3, lab4 ]
  workflow_dispatch:

env:
  SONAR_HOST_URL: ${{ vars.SONARQUBE_URL != '' && vars.SONARQUBE_URL || 'https://sonarcloud.io' }}

jobs:
  backend-test:
    name: "Backend: unit-тесты"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend unit tests with coverage
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "backend-test"

  backend-build:
    name: "Backend: компиляция"
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile backend
        working-directory: backend
        run: ./gradlew classes --no-daemon

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "backend-build"

  backend-integration:
    name: "Backend: integration-тесты"
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend integration tests
        working-directory: backend
        run: ./gradlew integrationTest --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "backend-integration"

  frontend-test:
    name: "Frontend: unit-тесты"
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend unit tests with coverage
        run: npm test -- --watchAll=false --coverage
        env:
          CI: "true"

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/coverage/

      - name: Upload frontend lcov report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lcov-report
          path: frontend/coverage/lcov.info

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "frontend-test"

  frontend-build:
    name: "Frontend: production-сборка"
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "frontend-build"

  sonarqube-scan:
    name: "SonarQube: анализ качества кода"
    runs-on: ubuntu-latest
    needs: [ backend-integration, frontend-test ]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download JaCoCo coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/test/

      - name: Download frontend lcov coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-lcov-report
          path: frontend/coverage/

      - name: Compile backend classes
        working-directory: backend
        run: ./gradlew classes --no-daemon

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Wait for SonarCloud quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: MacsiaProduction_DebtsApp
        run: scripts/sonar_qualitygate.sh

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "sonarqube-scan"

  publish-images:
    name: "Docker: публикация образов в GHCR"
    if: >-
      always() &&
      needs.backend-build.result == 'success' &&
      needs.backend-integration.result == 'success' &&
      needs.frontend-build.result == 'success' &&
      needs.sonarqube-scan.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(fromJson('["refs/heads/master","refs/heads/main","refs/heads/lab3","refs/heads/lab4"]'), github.ref)
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - backend-integration
      - frontend-build
      - sonarqube-scan
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute backend image tags
        id: backend-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/debtsapp-backend
          tags: |
            type=sha
            type=raw,value=lab3,enable=${{ github.ref_name == 'lab3' }}
            type=raw,value=lab4,enable=${{ github.ref_name == 'lab4' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      - name: Compute frontend image tags
        id: frontend-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/debtsapp-frontend
          tags: |
            type=sha
            type=raw,value=lab3,enable=${{ github.ref_name == 'lab3' }}
            type=raw,value=lab4,enable=${{ github.ref_name == 'lab4' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "publish-images"

  update-argocd-image:
    name: "GitOps: обновить image tag для Argo CD"
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(fromJson('["master","main","lab4"]'), github.ref_name) &&
      needs.publish-images.result == 'success'
    needs: [ publish-images ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image SHA tags in Helm values
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          sed -i "s|^    tag: .*|    tag: sha-${SHORT}|g" infra/helm/debtsapp-app/values.yaml

      - name: Commit and push [skip ci]
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/debtsapp-app/values.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update image tag to sha-${GITHUB_SHA:0:7} [skip ci]"
          git push

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "update-argocd-image"

  pipeline-summary:
    name: "Pipeline: итог CI/CD"
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - backend-build
      - backend-integration
      - frontend-test
      - frontend-build
      - sonarqube-scan
      - publish-images
      - update-argocd-image
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Compose pipeline status
        id: summary
        env:
          RESULTS: |
            backend-test=${{ needs.backend-test.result }}
            backend-build=${{ needs.backend-build.result }}
            backend-integration=${{ needs.backend-integration.result }}
            frontend-test=${{ needs.frontend-test.result }}
            frontend-build=${{ needs.frontend-build.result }}
            sonarqube-scan=${{ needs.sonarqube-scan.result }}
            publish-images=${{ needs.publish-images.result }}
            update-argocd-image=${{ needs.update-argocd-image.result }}
        run: |
          set -euo pipefail
          status=success
          failed=""
          details=""
          icon_for() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⏸️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "⚪" ;;
            esac
          }
          while IFS='=' read -r name result; do
            [ -z "$name" ] && continue
            details="${details}$(icon_for "$result") ${name}: ${result}"$'\n'
            case "$result" in
              failure|cancelled)
                status=failure
                failed="${failed}${name} (${result}); "
                ;;
            esac
          done <<< "$RESULTS"
          if [ -n "$failed" ]; then
            details="${details}"$'\n'"Failed: ${failed}"
          fi
          {
            echo "status=${status}"
            echo "details<<EOF"
            printf '%s' "$details"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram pipeline summary
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ steps.summary.outputs.status }}
          job_name:  "🧭 Pipeline summary"
          details:   ${{ steps.summary.outputs.details }}

      - name: Fail workflow when pipeline failed
        if: steps.summary.outputs.status == 'failure'
        run: exit 1
