name: "Deploy: VM и приложение"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Что запустить вручную
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - load_test
      app_domain:
        description: Публичный DNS для DebtsApp
        required: false
        default: debtsapp.macsia.fun
        type: string
      grafana_domain:
        description: Публичный DNS для Grafana
        required: false
        default: grafana.macsia.fun
        type: string
      acme_email:
        description: Email для HTTPS-сертификатов
        required: false
        default: macsia.production@gmail.com
        type: string
      vm_name:
        description: Имя VM в Yandex Cloud
        required: false
        default: debtsapp-k3s
        type: string
      zone:
        description: Зона Yandex Cloud
        required: false
        default: ru-central1-a
        type: string
      image_tag:
        description: Тег Docker-образов для deploy
        required: false
        default: lab3
        type: string
      k6_stages:
        description: k6 stages для load_test как пары duration:target
        required: false
        default: "30s:10,60s:40,60s:80,30s:0"
        type: string

jobs:
  deploy:
    if: ${{ inputs.operation == 'deploy' }}
    name: Развернуть VM и k3s-приложение
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/terraform/terraformrc
      TF_DIR: infra/terraform/yandex
      ANSIBLE_CONFIG: infra/ansible/ansible.cfg
      YC_TOKEN: ${{ secrets.YC_TOKEN }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      VM_NAME: ${{ inputs.vm_name }}
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Разрешить запуск deploy-скриптов
        run: chmod +x scripts/*.sh scripts/*.py

      - name: Установить Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить Ansible
        run: python -m pip install --upgrade pip ansible

      - name: Записать SSH-ключ для VM
        run: |
          # Ключ нужен Ansible для подключения к созданной VM.
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/debtsapp_vm
          chmod 600 ~/.ssh/debtsapp_vm

      - name: Подготовить имена Docker-образов
        run: |
          # Deploy берет один тег для backend и frontend, по умолчанию это lab3.
          image_namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "BACKEND_IMAGE=${image_namespace}/debtsapp-backend:${{ inputs.image_tag }}"
            echo "FRONTEND_IMAGE=${image_namespace}/debtsapp-frontend:${{ inputs.image_tag }}"
          } >> "$GITHUB_ENV"

      - name: Подготовить переменные Terraform и Ansible
        uses: ./.github/actions/prepare-deploy
        with:
          cloud_id: ${{ secrets.YC_CLOUD_ID }}
          folder_id: ${{ secrets.YC_FOLDER_ID }}
          ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
          admin_password_hash: ${{ secrets.VM_ADMIN_PASSWORD_HASH }}
          vm_name: ${{ inputs.vm_name }}
          zone: ${{ inputs.zone }}
          app_domain: ${{ inputs.app_domain }}
          grafana_domain: ${{ inputs.grafana_domain }}
          acme_email: ${{ inputs.acme_email }}
          backend_image: ${{ env.BACKEND_IMAGE }}
          frontend_image: ${{ env.FRONTEND_IMAGE }}
          ghcr_username: ${{ secrets.GHCR_PULL_USERNAME }}
          ghcr_token: ${{ secrets.GHCR_PULL_TOKEN }}
          postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          neo4j_password: ${{ secrets.NEO4J_PASSWORD }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          grafana_admin_user: grafana
          grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          bot_token: ${{ secrets.BOT_TOKEN }}

      - name: Инициализировать Terraform
        run: terraform -chdir="$TF_DIR" init

      - name: Создать или обновить VM
        run: scripts/terraform_apply.sh "$TF_DIR"

      - name: Сформировать inventory для Ansible
        run: |
          # Адрес VM берем из Terraform output или Yandex Cloud API.
          python scripts/resolve_ssh_host.py > /tmp/host.json
          SSH_KEY_FILE="$HOME/.ssh/debtsapp_vm" \
            scripts/render-ansible-inventory.sh /tmp/host.json > infra/ansible/inventory.ini

      - name: Дождаться SSH на VM
        run: |
          host="$(python -c 'import json;print(json.load(open("/tmp/host.json"))["host"])')"
          scripts/wait_for_ssh.sh "$host"

      - name: Запустить Ansible deploy в k3s
        run: ansible-playbook infra/ansible/site.yml -i infra/ansible/inventory.ini

      - name: Проверить публичные HTTPS endpoints
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --max-time 45 "https://${{ inputs.app_domain }}/" >/dev/null
          curl --fail --silent --show-error --location --max-time 45 "https://${{ inputs.app_domain }}/api/actuator/health"
          curl --fail --silent --show-error --location --max-time 45 "https://${{ inputs.grafana_domain }}/" >/dev/null
          curl --fail --silent --show-error --user "grafana:${{ secrets.GRAFANA_ADMIN_PASSWORD }}" --max-time 45 "https://${{ inputs.grafana_domain }}/api/user" >/dev/null

  load-test:
    if: ${{ inputs.operation == 'load_test' }}
    name: Запустить k6 и собрать HPA evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      YC_TOKEN: ${{ secrets.YC_TOKEN }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      VM_NAME: ${{ inputs.vm_name }}
      BASE_URL: https://${{ inputs.app_domain }}
      K6_STAGES: ${{ inputs.k6_stages }}
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Записать SSH-ключ для VM
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/debtsapp_vm
          chmod 600 ~/.ssh/debtsapp_vm

      - name: Определить SSH host
        run: |
          python scripts/resolve_ssh_host.py > /tmp/host.json
          host="$(python -c 'import json;print(json.load(open("/tmp/host.json"))["host"])')"
          user="$(python -c 'import json;print(json.load(open("/tmp/host.json"))["user"])')"
          port="$(python -c 'import json;print(json.load(open("/tmp/host.json"))["port"])')"
          echo "SSH_HOST=${host}" >> "$GITHUB_ENV"
          echo "SSH_USER=${user}" >> "$GITHUB_ENV"
          echo "SSH_PORT=${port}" >> "$GITHUB_ENV"

      - name: Запустить k6 и собирать HPA evidence
        run: |
          set -euo pipefail
          : > hpa-evidence.log
          mkdir -p load-results

          (
            for i in $(seq 1 24); do
              {
                echo "=== sample ${i} $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
                ssh -i ~/.ssh/debtsapp_vm -p "${SSH_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SSH_USER}@${SSH_HOST}" '
                  set +e
                  export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                  kubectl get hpa -n debtsapp -o wide
                  echo
                  kubectl get deploy,pods -n debtsapp -l app=debts-bot -o wide
                  echo
                  kubectl top pods -n debtsapp --containers || true
                '
              } >> hpa-evidence.log 2>&1
              sleep 15
            done
          ) &

          collector_pid="$!"
          trap 'kill "$collector_pid" 2>/dev/null || true; wait "$collector_pid" 2>/dev/null || true' EXIT

          docker run --rm \
            -e BASE_URL="${BASE_URL}" \
            -e K6_STAGES="${K6_STAGES}" \
            -v "${PWD}/scripts:/scripts:ro" \
            -v "${PWD}/load-results:/results" \
            grafana/k6 run --summary-export /results/load-summary.json /scripts/k6-backend-load.js

      - name: Собрать финальный HPA evidence
        if: always()
        run: |
          {
            echo "=== final $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            ssh -i ~/.ssh/debtsapp_vm -p "${SSH_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SSH_USER}@${SSH_HOST}" '
              set +e
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
              kubectl get hpa -n debtsapp -o wide
              echo
              kubectl get deploy,pods -n debtsapp -l app=debts-bot -o wide
              echo
              kubectl top pods -n debtsapp --containers || true
            '
          } >> hpa-evidence.log 2>&1

      - name: Сохранить load-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-evidence
          path: |
            load-results/load-summary.json
            hpa-evidence.log
