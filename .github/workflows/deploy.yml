name: "Deploy: VM и приложение"

on:
  workflow_dispatch:
    inputs:
      app_domain:
        description: Публичный DNS для DebtsApp
        required: false
        default: debtsapp.app.macsia.fun
        type: string
      grafana_domain:
        description: Публичный DNS для Grafana
        required: false
        default: grafana.app.macsia.fun
        type: string
      portainer_domain:
        description: Публичный DNS для Portainer UI
        required: false
        default: portainer.app.macsia.fun
        type: string
      argocd_domain:
        description: Публичный DNS для Argo CD UI
        required: false
        default: argocd.app.macsia.fun
        type: string
      acme_email:
        description: Email для HTTPS-сертификатов
        required: false
        default: macsia.production@gmail.com
        type: string
      vm_name:
        description: Имя VM в Yandex Cloud
        required: false
        default: debtsapp-lab4
        type: string
      zone:
        description: Зона Yandex Cloud
        required: false
        default: ru-central1-a
        type: string
      image_tag:
        description: Тег Docker-образов для deploy
        required: false
        default: latest
        type: string
      cloudflare_zone:
        description: Cloudflare zone, в которой живут DNS-записи
        required: false
        default: macsia.fun
        type: string

jobs:
  deploy:
    name: Развернуть VM и k3s-приложение
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/terraform/terraformrc
      ANSIBLE_CONFIG: infra/ansible/ansible.cfg
      YC_TOKEN: ${{ secrets.YC_TOKEN }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      VM_NAME: ${{ inputs.vm_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Notify Telegram (start)
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    "started"
          job_name:  "🚀 Deploy ${{ inputs.vm_name }}"
          details:   "image_tag=${{ inputs.image_tag }} app=${{ inputs.app_domain }} grafana=${{ inputs.grafana_domain }} argocd=${{ inputs.argocd_domain }} portainer=${{ inputs.portainer_domain }}"

      - name: Set up deploy tooling
        uses: ./.github/actions/setup-deploy-tooling
        with:
          ssh_private_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Render Terraform vars and Ansible secrets
        uses: ./.github/actions/prepare-deploy
        with:
          cloud_id:               ${{ secrets.YC_CLOUD_ID }}
          folder_id:              ${{ secrets.YC_FOLDER_ID }}
          ssh_public_key:         ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
          admin_password_hash:    ${{ secrets.VM_ADMIN_PASSWORD_HASH }}
          vm_name:                ${{ inputs.vm_name }}
          zone:                   ${{ inputs.zone }}
          app_domain:             ${{ inputs.app_domain }}
          grafana_domain:         ${{ inputs.grafana_domain }}
          portainer_domain:       ${{ inputs.portainer_domain }}
          portainer_admin_username: ${{ secrets.PORTAINER_ADMIN_USERNAME }}
          portainer_admin_password: ${{ secrets.PORTAINER_ADMIN_PASSWORD }}
          argocd_domain:          ${{ inputs.argocd_domain }}
          argocd_admin_username:  ${{ secrets.ARGOCD_ADMIN_USERNAME }}
          argocd_admin_password:  ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
          acme_email:             ${{ inputs.acme_email }}
          image_tag:              ${{ inputs.image_tag }}
          repository_owner:       ${{ github.repository_owner }}
          ghcr_username:          ${{ secrets.GHCR_PULL_USERNAME }}
          ghcr_token:             ${{ secrets.GHCR_PULL_TOKEN }}
          postgres_password:      ${{ secrets.POSTGRES_PASSWORD }}
          neo4j_password:         ${{ secrets.NEO4J_PASSWORD }}
          jwt_secret:             ${{ secrets.JWT_SECRET }}
          grafana_admin_user:     ${{ secrets.GRAFANA_ADMIN_USER }}
          grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          bot_token:              ${{ secrets.BOT_TOKEN }}
          github_repo_url:        https://github.com/${{ github.repository }}
          github_repo_token:      ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Provision VM and prepare inventory
        id: vm
        uses: ./.github/actions/provision-vm

      - name: Upsert Cloudflare DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE_NAME:         ${{ inputs.cloudflare_zone }}
          CF_TARGET_IP:         ${{ steps.vm.outputs.host }}
          CF_RECORDS:           "${{ inputs.app_domain }},${{ inputs.grafana_domain }},${{ inputs.argocd_domain }},${{ inputs.portainer_domain }}"
          CF_PROXIED:           "false"
          CF_TTL:               "60"
        run: python scripts/cloudflare_upsert_dns.py

      - name: Run Ansible deploy
        run: ansible-playbook infra/ansible/site.yml -i infra/ansible/inventory.ini

      - name: Verify public HTTPS endpoints
        run: |
          set -euo pipefail
          ok() { curl --fail --silent --show-error --location --max-time 45 "$@" >/dev/null; }
          ok "https://${{ inputs.app_domain }}/"
          ok "https://${{ inputs.app_domain }}/api/actuator/health"
          ok "https://${{ inputs.grafana_domain }}/"
          ok --user "${{ secrets.GRAFANA_ADMIN_USER }}:${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
             "https://${{ inputs.grafana_domain }}/api/user"
          ok "https://${{ inputs.argocd_domain }}/"
          ok "https://${{ inputs.portainer_domain }}/api/status"

      - name: Notify Telegram (result)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_ids:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          status:    ${{ job.status }}
          job_name:  "🌍 Deploy ${{ inputs.vm_name }}"
          details:   "VM=${{ inputs.vm_name }} ip=${{ steps.vm.outputs.host }} image_tag=${{ inputs.image_tag }} app=${{ inputs.app_domain }}"
