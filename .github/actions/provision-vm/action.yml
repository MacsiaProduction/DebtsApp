name: Provision VM and prepare inventory
description: Runs Terraform to create/update the VM, then resolves its SSH host, renders the Ansible inventory, and waits for SSH to be available.

inputs:
  tf_dir:
    required: false
    default: infra/terraform/yandex
  inventory_path:
    required: false
    default: infra/ansible/inventory.ini

outputs:
  host:
    description: Public IPv4 address of the provisioned VM
    value: ${{ steps.resolve.outputs.host }}
  user:
    description: SSH username for the VM
    value: ${{ steps.resolve.outputs.user }}
  port:
    description: SSH port for the VM
    value: ${{ steps.resolve.outputs.port }}

runs:
  using: composite
  steps:
    - name: Terraform init and apply
      shell: bash
      env:
        TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/terraform/terraformrc
      run: |
        terraform -chdir="${{ inputs.tf_dir }}" init
        bash scripts/terraform_apply.sh "${{ inputs.tf_dir }}"

    - name: Resolve VM host and render Ansible inventory
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        python scripts/resolve_ssh_host.py > /tmp/host.json
        SSH_KEY_FILE="$HOME/.ssh/debtsapp_vm" \
          bash scripts/render-ansible-inventory.sh /tmp/host.json > "${{ inputs.inventory_path }}"
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        with open("/tmp/host.json") as fh:
            info = json.load(fh)
        for key in ("host", "user", "port"):
            print(f"{key}={info[key]}")
        PY

    - name: Wait for SSH on VM
      shell: bash
      run: bash scripts/wait_for_ssh.sh "${{ steps.resolve.outputs.host }}"
