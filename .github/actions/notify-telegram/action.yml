name: Telegram notification
description: >-
  Sends a Telegram message for a CI/CD step. Auto-detects workflow/branch/run
  metadata from the GitHub Actions context. On failure pulls the failing step's
  tail from the Actions logs API and embeds it as a collapsed blockquote so
  recipients can read the error without opening the run URL.

inputs:
  bot_token:
    description: Telegram bot token (BOT_TOKEN)
    required: true
  chat_ids:
    description: Comma-separated Telegram chat IDs (TELEGRAM_CHAT_IDS)
    required: true
  status:
    description: success | failure | cancelled | skipped | started
    required: true
  job_name:
    description: Human-readable job label
    required: true
  github_token:
    description: GitHub token used to fetch failing step logs (defaults to GITHUB_TOKEN)
    required: false
    default: ''
  details:
    description: Extra context to prepend to the collapsed details block
    required: false
    default: ''
  log_tail_lines:
    description: How many lines from the failing step's log to embed
    required: false
    default: '60'
  workflow:
    description: Workflow name override (defaults to github.workflow)
    required: false
    default: ''
  ref_name:
    description: Ref name override (defaults to github.ref_name)
    required: false
    default: ''
  run_url:
    description: Run URL override (defaults to the current run URL)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Send Telegram message
      shell: bash
      env:
        BOT_TOKEN:        ${{ inputs.bot_token }}
        CHAT_IDS:         ${{ inputs.chat_ids }}
        STATUS:           ${{ inputs.status }}
        JOB_NAME:         ${{ inputs.job_name }}
        EXTRA_DETAILS:    ${{ inputs.details }}
        LOG_TAIL_LINES:   ${{ inputs.log_tail_lines }}
        WORKFLOW_OVERRIDE: ${{ inputs.workflow }}
        REF_OVERRIDE:     ${{ inputs.ref_name }}
        RUN_URL_OVERRIDE: ${{ inputs.run_url }}
        GH_REPO:          ${{ github.repository }}
        GH_SERVER_URL:    ${{ github.server_url }}
        GH_RUN_ID:        ${{ github.run_id }}
        GH_RUN_ATTEMPT:   ${{ github.run_attempt }}
        GH_WORKFLOW:      ${{ github.workflow }}
        GH_REF_NAME:      ${{ github.ref_name }}
        GH_JOB:           ${{ github.job }}
        GH_JOB_NAME:      ${{ job.name }}
        GH_SHA:           ${{ github.sha }}
        GH_ACTOR:         ${{ github.actor }}
        GH_RUN_STARTED:   ${{ github.run_started_at }}
        GH_TOKEN:         ${{ inputs.github_token != '' && inputs.github_token || github.token }}
      run: |
        set -u
        if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_IDS}" ]; then
          echo "BOT_TOKEN or CHAT_IDS empty; skipping Telegram notification"
          exit 0
        fi

        workflow="${WORKFLOW_OVERRIDE:-$GH_WORKFLOW}"
        ref_name="${REF_OVERRIDE:-$GH_REF_NAME}"
        run_url="${RUN_URL_OVERRIDE:-${GH_SERVER_URL}/${GH_REPO}/actions/runs/${GH_RUN_ID}}"
        commit="${GH_SHA:0:7}"
        actor="$GH_ACTOR"
        
        elapsed_text="unknown"
  
        job_json="$(
        curl -sS \
        -H "Authorization: Bearer ${GH_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/${GH_REPO}/actions/runs/${GH_RUN_ID}/jobs"
        )"
        
        job_info="$(
        echo "$job_json" |
        python3 -c '
        import json,sys
        
        jobs=json.load(sys.stdin).get("jobs", [])
      
        if jobs:
          # берём самый недавно стартовавший job
          job=max(jobs, key=lambda j: j.get("started_at") or "")
          
          print(job.get("started_at") or "")
          print(job.get("completed_at") or "")
          '
        )"
        
        started_at="$(echo "$job_info" | sed -n '1p')"
        completed_at="$(echo "$job_info" | sed -n '2p')"
        
        echo "START=$started_at"
        echo "END=$completed_at"
        
        if [ -n "$started_at" ]; then
        start=$(date -u -d "$started_at" +%s)
        
        if [ -n "$completed_at" ]; then
        end=$(date -u -d "$completed_at" +%s)
        else
        end=$(date -u +%s)
        fi
        
        elapsed=$((end - start))
        
        elapsed_h=$((elapsed / 3600))
        elapsed_m=$(((elapsed % 3600) / 60))
        elapsed_s=$((elapsed % 60))
        
        elapsed_text="${elapsed_h}h ${elapsed_m}m ${elapsed_s}s"
        fi
        
        case "$STATUS" in
          success)   emoji="✅" ;;
          failure)   emoji="❌" ;;
          cancelled) emoji="⏸️" ;;
          skipped)   emoji="⏭️" ;;
          started)   emoji="🚀" ;;
          *)         emoji="⚪" ;;
        esac

        esc() { printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

        # Best-effort: pull failing-step log tail via GH API on failure.
        log_payload=""
        if [ "$STATUS" = "failure" ]; then
          log_payload="$(python3 "${GITHUB_ACTION_PATH}/fetch_failed_log.py" 2>/dev/null || true)"
        fi
        
        # mask secrets
        mask() { 
          sed -E '
          s/(TOKEN=)[^ ]+/\1***/g;
          s/(PASSWORD=)[^ ]+/\1***/g;
          s/(SECRET=)[^ ]+/\1***/g;
          s/(KEY=)[^ ]+/\1***/g;
          s/(AUTH=)[^ ]+/\1***/g;
          s/(Bearer )[A-Za-z0-9\._\-]+/\1***/g;
          '
        }
        log_payload="$(printf "%s" "$log_payload" | mask)"
        extra="$(printf "%s" "$EXTRA_DETAILS" | mask)"

        # Assemble the collapsed-details payload (extra context + log).
        details_payload=""
        if [ -n "$extra" ] && [ -n "$log_payload" ]; then
          details_payload="${extra}"$'\n\n'"${log_payload}"
        elif [ -n "$extra" ]; then
          details_payload="$extra"
        elif [ -n "$log_payload" ]; then
          details_payload="$log_payload"
        fi

        # Telegram caps message at 4096 chars; reserve ~400 for the header/anchors.
        if [ -n "$details_payload" ]; then
          max_chars=3500
          if [ "${#details_payload}" -gt "$max_chars" ]; then
            details_payload="…(truncated)…"$'\n'"$(printf '%s' "$details_payload" | tail -c "$max_chars")"
          fi
        fi
        
        # pipeline summary grouping
        summary=""

        if [ "$JOB_NAME" = "Pipeline summary" ]; then
            summary="<b>Pipeline result:</b>"
            summary+=$'\n'
            summary+="$details_payload"
            details_payload="$summary"
        fi

        text="${emoji} <b>$(esc "$JOB_NAME")</b>"$'\n'
        text+="Branch: <code>$(esc "$ref_name")</code> · ${STATUS}"$'\n'
        text+="<a href=\"$(esc "$run_url")\">$(esc "$workflow")</a>"$'\n'
        text+="Commit: <code>${commit}</code>"$'\n'
        text+="Actor: <b>${actor}</b>"$'\n'
        text+="Duration: <code>${elapsed_text}</code>"$'\n'
        case "$STATUS" in
          failure|cancelled)
            if [ -n "$details_payload" ]; then
              text+=$'\n'"<blockquote expandable><pre>$(esc "$details_payload")</pre></blockquote>"
            fi
            ;;
          *)
            if [ -n "$EXTRA_DETAILS" ]; then
              text+=$'\n'"<blockquote expandable>$(esc "$EXTRA_DETAILS")</blockquote>"
            fi
            ;;
        esac

        IFS=',' read -ra IDS <<< "$CHAT_IDS"
        
        for raw_id in "${IDS[@]}"; do
          chat_id="$(echo "$raw_id" | tr -d ' ')"
          [ -z "$chat_id" ] && continue
        
          resp="$(
            curl \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            -sS \
            -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${chat_id}" \
            --data-urlencode "text=${text}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -w '\nHTTP:%{http_code}')"
          echo "tg chat=${chat_id}: ${resp}"
        
          code="$(echo "$resp" | grep HTTP | cut -d: -f2)"
          echo "$resp"
          if [ "$code" != "200" ]; then
                echo "Telegram send failed"
          fi
        done
