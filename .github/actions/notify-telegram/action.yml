name: Telegram notification
description: Sends a CI/CD job status message to every chat ID in a comma-separated whitelist.

inputs:
  bot_token:
    required: true
  chat_ids:
    description: Comma-separated list of Telegram chat IDs (stored in TELEGRAM_CHAT_IDS secret)
    required: true
  status:
    required: true   # success | failure | cancelled | skipped
  job_name:
    required: true
  workflow:
    required: true
  ref_name:
    required: true
  run_url:
    required: true

runs:
  using: composite
  steps:
    - name: Send Telegram message to all whitelisted recipients
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.bot_token }}
        CHAT_IDS:  ${{ inputs.chat_ids }}
        STATUS:    ${{ inputs.status }}
        JOB_NAME:  ${{ inputs.job_name }}
        WORKFLOW:  ${{ inputs.workflow }}
        REF_NAME:  ${{ inputs.ref_name }}
        RUN_URL:   ${{ inputs.run_url }}
      run: |
        case "$STATUS" in
          success)   EMOJI="✅" ;;
          failure)   EMOJI="❌" ;;
          cancelled) EMOJI="⏸" ;;
          *)         EMOJI="⚪" ;;
        esac
        TEXT="${EMOJI} *${JOB_NAME}*
Branch: \`${REF_NAME}\` | ${STATUS}
[${WORKFLOW}](${RUN_URL})"

        IFS=',' read -ra IDS <<< "$CHAT_IDS"
        for raw_id in "${IDS[@]}"; do
          chat_id="$(echo "$raw_id" | tr -d ' ')"
          [ -z "$chat_id" ] && continue
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${chat_id}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -o /dev/null
        done
