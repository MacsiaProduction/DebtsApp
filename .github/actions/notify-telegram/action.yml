name: Telegram notification
description: Sends a CI/CD job status message to every chat ID in a comma-separated whitelist.

inputs:
  bot_token:
    required: true
  chat_ids:
    description: Comma-separated list of Telegram chat IDs (stored in TELEGRAM_CHAT_IDS secret)
    required: true
  status:
    required: true   # success | failure | cancelled | skipped
  job_name:
    required: true
  workflow:
    required: true
  ref_name:
    required: true
  run_url:
    required: true
  details:
    description: Optional error summary shown as a collapsed quote block on failure
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Send Telegram message to all whitelisted recipients
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.bot_token }}
        CHAT_IDS:  ${{ inputs.chat_ids }}
        STATUS:    ${{ inputs.status }}
        JOB_NAME:  ${{ inputs.job_name }}
        WORKFLOW:  ${{ inputs.workflow }}
        REF_NAME:  ${{ inputs.ref_name }}
        RUN_URL:   ${{ inputs.run_url }}
        DETAILS:   ${{ inputs.details }}
      run: |
        if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_IDS}" ]; then
          echo "BOT_TOKEN or CHAT_IDS is empty, skipping Telegram notification"
          exit 0
        fi

        case "$STATUS" in
          success)   EMOJI="✅" ;;
          failure)   EMOJI="❌" ;;
          cancelled) EMOJI="⏸" ;;
          skipped)   EMOJI="⏭" ;;
          started)   EMOJI="🚀" ;;
          *)         EMOJI="⚪" ;;
        esac

        esc() {
          printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
        }

        JOB_ESC="$(esc "$JOB_NAME")"
        WF_ESC="$(esc "$WORKFLOW")"
        REF_ESC="$(esc "$REF_NAME")"
        STATUS_ESC="$(esc "$STATUS")"
        DETAILS_ESC="$(esc "$DETAILS")"

        TEXT="${EMOJI} <b>${JOB_ESC}</b>"$'\n'"Branch: <code>${REF_ESC}</code> | ${STATUS_ESC}"$'\n'"<a href=\"${RUN_URL}\">${WF_ESC}</a>"
        if [ -n "$DETAILS_ESC" ] && { [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ]; }; then
          TEXT="${TEXT}"$'\n'"<blockquote expandable>${DETAILS_ESC}</blockquote>"
        fi

        IFS=',' read -ra IDS <<< "$CHAT_IDS"
        for raw_id in "${IDS[@]}"; do
          chat_id="$(echo "$raw_id" | tr -d ' ')"
          [ -z "$chat_id" ] && continue
          response="$(curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${chat_id}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -w '\nHTTP_STATUS=%{http_code}')"
          echo "Telegram chat ${chat_id}: ${response}"
        done
