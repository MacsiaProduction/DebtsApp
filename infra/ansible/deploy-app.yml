---
- name: Развернуть DebtsApp в k3s
  hosts: debtsapp
  become: true
  gather_facts: false
  vars_files:
    - vars/deploy-secrets.yml
  vars:
    helm_repos:
      - { name: jetstack,              url: "https://charts.jetstack.io" }
      - { name: argo,                  url: "https://argoproj.github.io/argo-helm" }
      - { name: metrics-server,        url: "https://kubernetes-sigs.github.io/metrics-server/" }
    rollout_waits:
      - { kind: deployment,  name: cert-manager,            ns: cert-manager }
      - { kind: deployment,  name: cert-manager-webhook,    ns: cert-manager }
      - { kind: deployment,  name: cert-manager-cainjector, ns: cert-manager }
      - { kind: deployment,  name: metrics-server,          ns: kube-system }
      - { kind: statefulset, name: debts-bot-db,            ns: "{{ app_namespace }}" }
      - { kind: statefulset, name: debts-neo4j,             ns: "{{ app_namespace }}" }
      - { kind: deployment,  name: debts-bot,               ns: "{{ app_namespace }}" }
      - { kind: deployment,  name: debts-frontend,          ns: "{{ app_namespace }}" }
      - { kind: deployment,  name: "{{ monitoring_release_name }}-kube-prometheus-operator", ns: "{{ monitoring_namespace }}" }
      - { kind: deployment,  name: "{{ monitoring_release_name }}-grafana",                  ns: "{{ monitoring_namespace }}" }
      - { kind: deployment,  name: argocd-server,           ns: argocd }
    service_endpoint_waits:
      - { name: debts-bot,      ns: "{{ app_namespace }}" }
      - { name: debts-frontend, ns: "{{ app_namespace }}" }
      - { name: argocd-server,  ns: argocd }
    route_smoke_checks:
      - { name: frontend,       host: "{{ app_domain }}", url: "https://{{ app_domain }}/" }
      - { name: backend_health, host: "{{ app_domain }}", url: "https://{{ app_domain }}/api/actuator/health" }
      - { name: grafana,        host: "{{ grafana_domain }}", url: "https://{{ grafana_domain }}/" }
      - { name: argocd,         host: "{{ argocd_domain }}", url: "https://{{ argocd_domain }}/" }
      - { name: portainer,      host: "{{ portainer_domain }}", url: "https://{{ portainer_domain }}/" }
    argocd_application_waits:
      - debtsapp-bootstrap
      - debtsapp-argocd
      - debtsapp-monitoring
      - debtsapp-portainer
      - debtsapp
  environment:
    KUBECONFIG: "{{ k3s_kubeconfig }}"

  tasks:
    - name: Создать директории для манифестов
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ manifest_dir }}"
        - "{{ manifest_dir }}/app"

    - name: Очистить старые сгенерированные манифесты
      # На прошлых деплоях здесь лежат файлы, удалённые из репозитория
      # (например 94-sonarqube.yaml). Чистим каталог до рендеринга, чтобы
      # kubectl apply -f не воскрешал отброшенные ресурсы.
      ansible.builtin.shell: |
        set -euo pipefail
        find {{ manifest_dir }}/app -maxdepth 1 -type f \( -name '[0-9]*.yaml' -o -name '00-*.yaml' \) -delete
      args:
        executable: /bin/bash
      changed_when: false

    - name: Добавить Helm-репозитории
      ansible.builtin.command: helm repo add {{ item.name }} {{ item.url }}
      loop: "{{ helm_repos }}"
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"
      failed_when:
        - helm_repo_add.rc != 0
        - "'already exists' not in helm_repo_add.stderr"

    - name: Обновить Helm-репозитории
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Установить cert-manager
      ansible.builtin.command: >-
        helm upgrade --install cert-manager jetstack/cert-manager
        --namespace cert-manager --create-namespace --set crds.enabled=true

    - name: Проверить наличие metrics-server
      ansible.builtin.command: kubectl -n kube-system get deployment metrics-server
      register: metrics_server_status
      changed_when: false
      failed_when: metrics_server_status.rc not in [0, 1]

    - name: Установить metrics-server если его нет
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - metrics-server
          - metrics-server/metrics-server
          - --namespace
          - kube-system
          - --set
          - args[0]=--kubelet-insecure-tls
          - --set
          - args[1]=--kubelet-preferred-address-types=InternalIP\,ExternalIP\,Hostname
      when: metrics_server_status.rc == 1

    - name: Установить apache2-utils (для htpasswd)
      ansible.builtin.apt:
        name: apache2-utils
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Сгенерировать bcrypt-хэш пароля Argo CD
      ansible.builtin.command:
        argv:
          - htpasswd
          - -bnBC
          - "10"
          - ""
          - "{{ argocd_admin_password }}"
      register: argocd_password_raw
      changed_when: false
      no_log: true

    - name: Извлечь чистый bcrypt-хэш ($2a$...)
      ansible.builtin.set_fact:
        argocd_admin_password_hash: >-
          {{ argocd_password_raw.stdout
             | regex_replace('^:', '')
             | regex_replace('^\$2y', '$2a') }}
      no_log: true

    - name: Сформировать values для Argo CD
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/argocd-values.yaml.j2"
        dest: "{{ manifest_dir }}/argocd-values.yaml"
        mode: "0600"
      no_log: true

    - name: Удалить устаревший namespace sonarqube
      ansible.builtin.command: kubectl delete namespace sonarqube --ignore-not-found --wait=false
      register: sonarqube_cleanup
      changed_when: "'deleted' in sonarqube_cleanup.stdout"
      failed_when: false

    - name: Сформировать Argo CD приложения
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/92-argocd-app.yaml.j2"
        dest: "{{ manifest_dir }}/app/92-argocd-app.yaml"
        mode: "0644"

    - name: Установить Argo CD
      ansible.builtin.command: >-
        helm upgrade --install argocd argo/argo-cd
        --namespace argocd --create-namespace
        --version 9.5.14
        --values {{ manifest_dir }}/argocd-values.yaml
      register: argocd_install
      retries: 3
      delay: 15
      until: argocd_install.rc == 0

    - name: Перезапустить argocd-server для применения нового пароля
      ansible.builtin.command: kubectl -n argocd rollout restart deployment/argocd-server
      changed_when: false

    - name: Дождаться готовности Argo CD server
      ansible.builtin.command: kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
      changed_when: false

    # kubectl apply -f dir обрабатывает все манифесты директории разом.
    - name: Применить Argo CD приложения
      ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/app/

    - name: Удалить legacy ServiceMonitor из namespace приложения после миграции
      ansible.builtin.shell: |
        if kubectl -n {{ monitoring_namespace }} get servicemonitor debts-bot >/dev/null 2>&1; then
          kubectl -n {{ app_namespace }} delete servicemonitor debts-bot --ignore-not-found
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Запросить refresh и дождаться синхронизации Argo CD приложений
      ansible.builtin.shell: |
        set -e
        kubectl -n argocd annotate application {{ item }} \
          argocd.argoproj.io/refresh=normal --overwrite >/dev/null
        deadline=$((SECONDS + 360))
        while [ "$SECONDS" -lt "$deadline" ]; do
          sync=$(kubectl -n argocd get application {{ item }} -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "")
          health=$(kubectl -n argocd get application {{ item }} -o jsonpath='{.status.health.status}' 2>/dev/null || echo "")
          if [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]; then
            echo "argocd {{ item }} Synced+Healthy"
            exit 0
          fi
          sleep 5
        done
        echo "argocd {{ item }} not Synced+Healthy: sync=$sync health=$health" >&2
        kubectl -n argocd get application {{ item }} -o yaml | tail -60 >&2 || true
        exit 1
      args:
        executable: /bin/bash
      changed_when: false
      loop: "{{ argocd_application_waits }}"

    - name: Проверить ранние ошибки pod
      ansible.builtin.shell: |
        bad="$(kubectl -n {{ app_namespace }} get pods --no-headers \
          -o 'custom-columns=NAME:.metadata.name,REASON:.status.containerStatuses[*].state.waiting.reason' \
          2>/dev/null | grep -E 'InvalidImageName|ImagePullBackOff|ErrImagePull|CreateContainerConfigError' || true)"
        if [ -n "$bad" ]; then printf '%s\n' "$bad" >&2; exit 1; fi
      args:
        executable: /bin/bash
      register: pod_precheck
      changed_when: false
      failed_when: false

    - name: Завершить с ошибкой если pod в неисправимом состоянии
      when: pod_precheck.rc != 0
      ansible.builtin.fail:
        msg: "Detected pods in unrecoverable state (InvalidImageName / ImagePullBackOff). Check image registry path."

    - name: Дождаться rollout workloads
      ansible.builtin.command: kubectl rollout status {{ item.kind }}/{{ item.name }} -n {{ item.ns }} --timeout=300s
      loop: "{{ rollout_waits }}"
      register: rollout_status
      changed_when: false
      failed_when: false

    - name: Дождаться endpoints для Traefik
      ansible.builtin.shell: |
        deadline=$((SECONDS + 120))
        while [ "$SECONDS" -lt "$deadline" ]; do
          endpoints="$(kubectl -n {{ item.ns }} get endpoints {{ item.name }} -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null)"
          if [ -n "$endpoints" ]; then
            printf '%s\n' "$endpoints"
            exit 0
          fi
          sleep 5
        done
        exit 1
      args:
        executable: /bin/bash
      loop: "{{ service_endpoint_waits }}"
      register: endpoint_status
      changed_when: false
      failed_when: false

    - name: Сохранить список неготовых Kubernetes-ресурсов
      ansible.builtin.set_fact:
        failed_rollouts: "{{ rollout_status.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"
        missing_endpoints: "{{ endpoint_status.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"

    - name: Показать неготовые rollout
      when: failed_rollouts | length > 0
      ansible.builtin.debug:
        msg: "Workload {{ item.item.kind }}/{{ item.item.name }} in {{ item.item.ns }} is not ready: {{ item.stderr | default('') }}"
      loop: "{{ failed_rollouts }}"

    - name: Показать сервисы без endpoints
      when: missing_endpoints | length > 0
      ansible.builtin.debug:
        msg: "Service {{ item.item.name }} in {{ item.item.ns }} has no ready endpoints"
      loop: "{{ missing_endpoints }}"

    - name: Собрать диагностику rollout
      when: (failed_rollouts | length > 0) or (missing_endpoints | length > 0)
      ansible.builtin.include_tasks: tasks/diagnose.yml

    - name: Завершить с ошибкой если workloads или endpoints не готовы
      when: (failed_rollouts | length > 0) or (missing_endpoints | length > 0)
      ansible.builtin.fail:
        msg: "Some Kubernetes workloads or Traefik service endpoints are not ready; see diagnostics above"

    - name: Инициализировать admin и local-cluster в Portainer
      when: portainer_admin_password | length > 0
      ansible.builtin.shell: |
        set -uo pipefail
        BASE="http://127.0.0.1"
        HOST_HEADER="{{ portainer_domain }}"
        USER='{{ portainer_admin_username }}'
        PWD='{{ portainer_admin_password }}'
        AUTH_BODY=$(printf '{"Username":"%s","Password":"%s"}' "$USER" "$PWD")

        deadline=$((SECONDS + 300))
        while [ "$SECONDS" -lt "$deadline" ]; do
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Host: ${HOST_HEADER}" "${BASE}/api/status" || true)"
          if [ "$status" = "200" ]; then break; fi
          sleep 5
        done

        # /api/users/admin/init: одноразовая регистрация первого admin, повтор → 409.
        init_code=$(curl -sS -o /tmp/portainer-init.out -w '%{http_code}' \
          -X POST -H "Host: ${HOST_HEADER}" -H "Content-Type: application/json" \
          --data "$AUTH_BODY" "${BASE}/api/users/admin/init" || echo 000)

        case "$init_code" in
          200|201)
            echo "portainer admin created"
            ;;
          409)
            auth_code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST -H "Host: ${HOST_HEADER}" -H "Content-Type: application/json" \
              --data "$AUTH_BODY" "${BASE}/api/auth")
            if [ "$auth_code" = "200" ]; then
              echo "portainer already initialized with the desired credentials"
            else
              echo "portainer is initialized but credentials differ (HTTP ${auth_code} from /api/auth); reset PVC to retry" >&2
              exit 1
            fi
            ;;
          *)
            echo "portainer init failed (HTTP ${init_code})" >&2
            cat /tmp/portainer-init.out >&2 || true
            exit 1
            ;;
        esac

        # Получаем JWT и регистрируем local Kubernetes endpoint, если ещё нет.
        JWT=$(curl -sS -X POST -H "Host: ${HOST_HEADER}" -H "Content-Type: application/json" \
          --data "$AUTH_BODY" "${BASE}/api/auth" | python3 -c "import json,sys; print(json.load(sys.stdin)['jwt'])")
        existing=$(curl -sS -H "Host: ${HOST_HEADER}" -H "Authorization: Bearer ${JWT}" \
          "${BASE}/api/endpoints?excludeSnapshots=true" \
          | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
        if [ "$existing" -gt 0 ]; then
          echo "portainer endpoint already registered (count=${existing})"
          exit 0
        fi

        # EndpointCreationType=5 — Local Kubernetes (controller сам подхватит in-cluster config).
        create_code=$(curl -sS -o /tmp/portainer-endpoint.out -w '%{http_code}' \
          -X POST -H "Host: ${HOST_HEADER}" -H "Authorization: Bearer ${JWT}" \
          -F "Name=local" -F "EndpointCreationType=5" \
          "${BASE}/api/endpoints")
        if [ "$create_code" = "200" ] || [ "$create_code" = "201" ]; then
          echo "portainer local k8s endpoint registered"
        else
          echo "portainer endpoint registration failed (HTTP ${create_code})" >&2
          cat /tmp/portainer-endpoint.out >&2 || true
          exit 1
        fi
      args:
        executable: /bin/bash
      register: portainer_init
      changed_when: >-
        ('created' in (portainer_init.stdout | default(''))) or
        ('registered' in (portainer_init.stdout | default('')))

    - name: Дождаться выпуска TLS-сертификатов cert-manager
      ansible.builtin.shell: |
        set -euo pipefail
        deadline=$((SECONDS + 360))
        while [ "$SECONDS" -lt "$deadline" ]; do
          not_ready="$(kubectl get certificates --all-namespaces \
            -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}={.status.conditions[?(@.type=="Ready")].status} {end}' \
            2>/dev/null | tr ' ' '\n' | grep -v '=True' | grep -v '^$' || true)"
          if [ -z "$not_ready" ]; then
            echo "all certificates Ready"
            exit 0
          fi
          echo "waiting for: ${not_ready}"
          sleep 10
        done
        echo "Timed out waiting for certificates: ${not_ready}" >&2
        exit 1
      args:
        executable: /bin/bash
      register: cert_wait
      changed_when: false
      failed_when: false

    - name: Проверить маршруты Traefik через локальный ingress
      ansible.builtin.shell: |
        curl --fail --silent --show-error --location --max-time 30 \
          --resolve {{ item.host }}:443:127.0.0.1 \
          {{ item.url | quote }}
      args:
        executable: /bin/bash
      loop: "{{ route_smoke_checks }}"
      register: route_smoke_status
      changed_when: false
      failed_when: false

    - name: Сохранить список неработающих публичных маршрутов
      ansible.builtin.set_fact:
        failed_route_smoke_checks: "{{ route_smoke_status.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"

    - name: Показать неработающие публичные маршруты
      when: failed_route_smoke_checks | length > 0
      ansible.builtin.debug:
        msg: "Route smoke check {{ item.item.name }} failed for {{ item.item.url }}: {{ item.stderr | default('') }}"
      loop: "{{ failed_route_smoke_checks }}"

    - name: Собрать диагностику ingress/TLS
      when: failed_route_smoke_checks | length > 0
      ansible.builtin.include_tasks: tasks/diagnose.yml

    - name: Завершить с ошибкой если публичные маршруты не отвечают
      when: failed_route_smoke_checks | length > 0
      ansible.builtin.fail:
        msg: "One or more Traefik HTTPS routes are not serving correctly; see diagnostics above"
