---
- name: Развернуть DebtsApp в k3s
  hosts: debtsapp
  become: true
  gather_facts: false
  vars_files:
    - vars/deploy-secrets.yml
  vars:
    app_manifest_templates:
      - 10-namespace.yaml.j2
      - 20-secrets-config.yaml.j2
      - 30-postgres.yaml.j2
      - 40-neo4j.yaml.j2
      - 50-backend.yaml.j2
      - 60-frontend.yaml.j2
      - 70-ingress.yaml.j2
      - 80-hpa.yaml.j2
      - 90-monitoring.yaml.j2
    helm_repos:
      - { name: jetstack,             url: "https://charts.jetstack.io" }
      - { name: prometheus-community, url: "https://prometheus-community.github.io/helm-charts" }
    rollout_waits:
      - { kind: deployment,  name: cert-manager,            ns: cert-manager }
      - { kind: deployment,  name: cert-manager-webhook,    ns: cert-manager }
      - { kind: deployment,  name: cert-manager-cainjector, ns: cert-manager }
      - { kind: deployment,  name: metrics-server,          ns: kube-system }
      - { kind: statefulset, name: debts-bot-db,            ns: "{{ app_namespace }}" }
      - { kind: statefulset, name: debts-neo4j,             ns: "{{ app_namespace }}" }
      - { kind: deployment,  name: debts-bot,               ns: "{{ app_namespace }}" }
      - { kind: deployment,  name: debts-frontend,          ns: "{{ app_namespace }}" }
      - { kind: deployment,  name: "{{ monitoring_release_name }}-kube-prometheus-operator", ns: "{{ monitoring_namespace }}" }
      - { kind: deployment,  name: "{{ monitoring_release_name }}-grafana",                  ns: "{{ monitoring_namespace }}" }
    service_endpoint_waits:
      - { name: debts-bot,      ns: "{{ app_namespace }}" }
      - { name: debts-frontend, ns: "{{ app_namespace }}" }
  environment:
    KUBECONFIG: "{{ k3s_kubeconfig }}"

  tasks:
    - name: Создать директории для манифестов
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ manifest_dir }}"
        - "{{ manifest_dir }}/app"

    - name: Добавить Helm-репозитории
      ansible.builtin.command: helm repo add {{ item.name }} {{ item.url }}
      loop: "{{ helm_repos }}"
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"
      failed_when:
        - helm_repo_add.rc != 0
        - "'already exists' not in helm_repo_add.stderr"

    - name: Обновить Helm-репозитории
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Установить cert-manager
      ansible.builtin.command: >-
        helm upgrade --install cert-manager jetstack/cert-manager
        --namespace cert-manager --create-namespace --set crds.enabled=true

    - name: Проверить наличие metrics-server
      ansible.builtin.command: kubectl -n kube-system get deployment metrics-server
      register: metrics_server_status
      changed_when: false
      failed_when: metrics_server_status.rc not in [0, 1]

    - name: Установить metrics-server если его нет
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - metrics-server
          - metrics-server/metrics-server
          - --namespace
          - kube-system
          - --set
          - args[0]=--kubelet-insecure-tls
          - --set
          - args[1]=--kubelet-preferred-address-types=InternalIP\,ExternalIP\,Hostname
      when: metrics_server_status.rc == 1

    - name: Сформировать манифест ClusterIssuer
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/cluster-issuer.yaml.j2"
        dest: "{{ manifest_dir }}/app/00-cluster-issuer.yaml"
        mode: "0644"

    - name: Сформировать values для мониторинга
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/monitoring-values.yaml.j2"
        dest: "{{ manifest_dir }}/monitoring-values.yaml"
        mode: "0600"

    - name: Сформировать манифесты приложения
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/{{ item }}"
        dest: "{{ manifest_dir }}/app/{{ item | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ app_manifest_templates }}"

    - name: Применить манифест ClusterIssuer
      ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/app/00-cluster-issuer.yaml

    - name: Установить kube-prometheus-stack
      ansible.builtin.command: >-
        helm upgrade --install {{ monitoring_release_name }} prometheus-community/kube-prometheus-stack
        --namespace {{ monitoring_namespace }} --create-namespace
        --values {{ manifest_dir }}/monitoring-values.yaml
      register: monitoring_install
      retries: 3
      delay: 20
      until: monitoring_install.rc == 0

    # kubectl apply -f dir обрабатывает все манифесты директории разом.
    - name: Применить манифесты приложения
      ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/app/

    - name: Дождаться rollout workloads
      ansible.builtin.shell: |
        deadline=$((SECONDS + 480))
        last_output=""

        while [ "$SECONDS" -lt "$deadline" ]; do
          output="$(kubectl rollout status {{ item.kind }}/{{ item.name }} -n {{ item.ns }} --timeout=30s 2>&1)"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            printf '%s\n' "$output"
            exit 0
          fi

          last_output="$output"
          sleep 10
        done

        printf '%s\n' "$last_output" >&2
        exit 1
      args:
        executable: /bin/bash
      loop: "{{ rollout_waits }}"
      register: rollout_status
      changed_when: false
      failed_when: false

    - name: Дождаться endpoints для Traefik
      ansible.builtin.shell: |
        deadline=$((SECONDS + 120))

        while [ "$SECONDS" -lt "$deadline" ]; do
          endpoints="$(kubectl -n {{ item.ns }} get endpoints {{ item.name }} -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null)"
          if [ -n "$endpoints" ]; then
            printf '%s\n' "$endpoints"
            exit 0
          fi

          sleep 5
        done

        exit 1
      args:
        executable: /bin/bash
      loop: "{{ service_endpoint_waits }}"
      register: endpoint_status
      changed_when: false
      failed_when: false

    - name: Сохранить список неготовых Kubernetes-ресурсов
      ansible.builtin.set_fact:
        failed_rollouts: "{{ rollout_status.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"
        missing_endpoints: "{{ endpoint_status.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"

    - name: Показать неготовые rollout
      when: failed_rollouts | length > 0
      ansible.builtin.debug:
        msg: |
          Workload {{ item.item.kind }}/{{ item.item.name }} in namespace {{ item.item.ns }} is not ready.
          stdout: {{ item.stdout | default('') }}
          stderr: {{ item.stderr | default('') }}
      loop: "{{ failed_rollouts }}"

    - name: Показать сервисы без endpoints
      when: missing_endpoints | length > 0
      ansible.builtin.debug:
        msg: "Service {{ item.item.name }} in namespace {{ item.item.ns }} has no ready endpoints"
      loop: "{{ missing_endpoints }}"

    - name: Собрать диагностику rollout
      when: >
        (failed_rollouts | length > 0) or (missing_endpoints | length > 0)
      ansible.builtin.shell: |
        set +e
        echo "=== debtsapp pods ==="
        kubectl -n {{ app_namespace }} get pods -o wide
        echo
        echo "=== debtsapp deployments ==="
        kubectl -n {{ app_namespace }} get deployments -o wide
        echo
        echo "=== debtsapp statefulsets ==="
        kubectl -n {{ app_namespace }} get statefulsets -o wide
        echo
        echo "=== debtsapp services/endpoints ==="
        kubectl -n {{ app_namespace }} get svc,endpoints -o wide
        echo
        echo "=== debtsapp ingress ==="
        kubectl -n {{ app_namespace }} get ingress -o wide
        echo
        echo "=== recent debtsapp events ==="
        kubectl -n {{ app_namespace }} get events --sort-by=.lastTimestamp | tail -n 80
        echo
        echo "=== frontend describe ==="
        kubectl -n {{ app_namespace }} describe deployment debts-frontend
        echo
        echo "=== backend describe ==="
        kubectl -n {{ app_namespace }} describe deployment debts-bot
        echo
        echo "=== monitoring pods ==="
        kubectl -n {{ monitoring_namespace }} get pods -o wide
      args:
        executable: /bin/bash
      register: rollout_diagnostics
      changed_when: false

    - name: Показать диагностику rollout
      when: rollout_diagnostics is defined and rollout_diagnostics.stdout_lines is defined
      ansible.builtin.debug:
        var: rollout_diagnostics.stdout_lines

    - name: Завершить с ошибкой если workloads или endpoints не готовы
      when: >
        (failed_rollouts | length > 0) or (missing_endpoints | length > 0)
      ansible.builtin.fail:
        msg: "Some Kubernetes workloads or Traefik service endpoints are not ready; see diagnostics above"
