---
- name: Развернуть DebtsApp в k3s
  hosts: debtsapp
  become: true
  gather_facts: false
  vars_files:
    - vars/deploy-secrets.yml
  vars:
    helm_repos:
      - { name: jetstack,              url: "https://charts.jetstack.io" }
      - { name: prometheus-community,  url: "https://prometheus-community.github.io/helm-charts" }
      - { name: argo,                  url: "https://argoproj.github.io/argo-helm" }
    rollout_waits:
      - { kind: deployment,  name: cert-manager,            ns: cert-manager }
      - { kind: deployment,  name: cert-manager-webhook,    ns: cert-manager }
      - { kind: deployment,  name: cert-manager-cainjector, ns: cert-manager }
      - { kind: deployment,  name: metrics-server,          ns: kube-system }
      - { kind: statefulset, name: debts-bot-db,            ns: "{{ app_namespace }}" }
      - { kind: statefulset, name: debts-neo4j,             ns: "{{ app_namespace }}" }
      - { kind: deployment,  name: debts-bot,               ns: "{{ app_namespace }}" }
      - { kind: deployment,  name: debts-frontend,          ns: "{{ app_namespace }}" }
      - { kind: deployment,  name: "{{ monitoring_release_name }}-kube-prometheus-operator", ns: "{{ monitoring_namespace }}" }
      - { kind: deployment,  name: "{{ monitoring_release_name }}-grafana",                  ns: "{{ monitoring_namespace }}" }
      - { kind: statefulset, name: sonarqube-db,                                             ns: sonarqube }
      - { kind: statefulset, name: sonarqube,                                                ns: sonarqube }
      - { kind: deployment,  name: argocd-server,           ns: argocd }
    service_endpoint_waits:
      - { name: debts-bot,      ns: "{{ app_namespace }}" }
      - { name: debts-frontend, ns: "{{ app_namespace }}" }
      - { name: argocd-server,  ns: argocd }
    route_smoke_checks:
      - { name: frontend,       host: "{{ app_domain }}", url: "https://{{ app_domain }}/" }
      - { name: backend_health, host: "{{ app_domain }}", url: "https://{{ app_domain }}/api/actuator/health" }
      - { name: grafana,        host: "{{ grafana_domain }}", url: "https://{{ grafana_domain }}/" }
      - { name: argocd,         host: "{{ argocd_domain }}", url: "https://{{ argocd_domain }}/" }
  environment:
    KUBECONFIG: "{{ k3s_kubeconfig }}"

  tasks:
    - name: Создать директории для манифестов
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ manifest_dir }}"
        - "{{ manifest_dir }}/app"

    - name: Добавить Helm-репозитории
      ansible.builtin.command: helm repo add {{ item.name }} {{ item.url }}
      loop: "{{ helm_repos }}"
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"
      failed_when:
        - helm_repo_add.rc != 0
        - "'already exists' not in helm_repo_add.stderr"

    - name: Обновить Helm-репозитории
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Установить cert-manager
      ansible.builtin.command: >-
        helm upgrade --install cert-manager jetstack/cert-manager
        --namespace cert-manager --create-namespace --set crds.enabled=true

    - name: Проверить наличие metrics-server
      ansible.builtin.command: kubectl -n kube-system get deployment metrics-server
      register: metrics_server_status
      changed_when: false
      failed_when: metrics_server_status.rc not in [0, 1]

    - name: Установить metrics-server если его нет
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - metrics-server
          - metrics-server/metrics-server
          - --namespace
          - kube-system
          - --set
          - args[0]=--kubelet-insecure-tls
          - --set
          - args[1]=--kubelet-preferred-address-types=InternalIP\,ExternalIP\,Hostname
      when: metrics_server_status.rc == 1

    - name: Сформировать манифест ClusterIssuer
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/cluster-issuer.yaml.j2"
        dest: "{{ manifest_dir }}/app/00-cluster-issuer.yaml"
        mode: "0644"

    - name: Сформировать values для мониторинга
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/monitoring-values.yaml.j2"
        dest: "{{ manifest_dir }}/monitoring-values.yaml"
        mode: "0600"

    - name: Сформировать манифесты приложения
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ manifest_dir }}/app/{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      with_fileglob: "{{ playbook_dir }}/../k8s/[0-9]*.yaml.j2"

    - name: Применить манифест ClusterIssuer
      ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/app/00-cluster-issuer.yaml

    - name: Установить kube-prometheus-stack
      ansible.builtin.command: >-
        helm upgrade --install {{ monitoring_release_name }} prometheus-community/kube-prometheus-stack
        --namespace {{ monitoring_namespace }} --create-namespace
        --values {{ manifest_dir }}/monitoring-values.yaml
      register: monitoring_install
      retries: 3
      delay: 20
      until: monitoring_install.rc == 0

    - name: Установить Argo CD
      ansible.builtin.command: >-
        helm upgrade --install argocd argo/argo-cd
        --namespace argocd --create-namespace
        --set server.insecure=true
        --set configs.params."server\.insecure"=true
      register: argocd_install
      retries: 3
      delay: 15
      until: argocd_install.rc == 0

    - name: Дождаться готовности Argo CD server
      ansible.builtin.command: kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
      changed_when: false

    # kubectl apply -f dir обрабатывает все манифесты директории разом.
    - name: Применить манифесты приложения
      ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/app/

    - name: Проверить ранние ошибки pod
      ansible.builtin.shell: |
        bad="$(kubectl -n {{ app_namespace }} get pods --no-headers \
          -o 'custom-columns=NAME:.metadata.name,REASON:.status.containerStatuses[*].state.waiting.reason' \
          2>/dev/null | grep -E 'InvalidImageName|ImagePullBackOff|ErrImagePull|CreateContainerConfigError' || true)"
        if [ -n "$bad" ]; then printf '%s\n' "$bad" >&2; exit 1; fi
      args:
        executable: /bin/bash
      register: pod_precheck
      changed_when: false
      failed_when: false

    - name: Завершить с ошибкой если pod в неисправимом состоянии
      when: pod_precheck.rc != 0
      ansible.builtin.fail:
        msg: "Detected pods in unrecoverable state (InvalidImageName / ImagePullBackOff). Check image registry path."

    - name: Дождаться rollout workloads
      ansible.builtin.command: kubectl rollout status {{ item.kind }}/{{ item.name }} -n {{ item.ns }} --timeout=300s
      loop: "{{ rollout_waits }}"
      register: rollout_status
      changed_when: false
      failed_when: false

    - name: Дождаться endpoints для Traefik
      ansible.builtin.shell: |
        deadline=$((SECONDS + 120))
        while [ "$SECONDS" -lt "$deadline" ]; do
          endpoints="$(kubectl -n {{ item.ns }} get endpoints {{ item.name }} -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null)"
          if [ -n "$endpoints" ]; then
            printf '%s\n' "$endpoints"
            exit 0
          fi
          sleep 5
        done
        exit 1
      args:
        executable: /bin/bash
      loop: "{{ service_endpoint_waits }}"
      register: endpoint_status
      changed_when: false
      failed_when: false

    - name: Сохранить список неготовых Kubernetes-ресурсов
      ansible.builtin.set_fact:
        failed_rollouts: "{{ rollout_status.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"
        missing_endpoints: "{{ endpoint_status.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"

    - name: Показать неготовые rollout
      when: failed_rollouts | length > 0
      ansible.builtin.debug:
        msg: "Workload {{ item.item.kind }}/{{ item.item.name }} in {{ item.item.ns }} is not ready: {{ item.stderr | default('') }}"
      loop: "{{ failed_rollouts }}"

    - name: Показать сервисы без endpoints
      when: missing_endpoints | length > 0
      ansible.builtin.debug:
        msg: "Service {{ item.item.name }} in {{ item.item.ns }} has no ready endpoints"
      loop: "{{ missing_endpoints }}"

    - name: Собрать диагностику rollout
      when: (failed_rollouts | length > 0) or (missing_endpoints | length > 0)
      ansible.builtin.include_tasks: tasks/diagnose.yml

    - name: Завершить с ошибкой если workloads или endpoints не готовы
      when: (failed_rollouts | length > 0) or (missing_endpoints | length > 0)
      ansible.builtin.fail:
        msg: "Some Kubernetes workloads or Traefik service endpoints are not ready; see diagnostics above"

    - name: Дождаться выпуска TLS-сертификатов cert-manager
      ansible.builtin.shell: |
        set -euo pipefail
        deadline=$((SECONDS + 360))
        while [ "$SECONDS" -lt "$deadline" ]; do
          not_ready="$(kubectl get certificates --all-namespaces \
            -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}={.status.conditions[?(@.type=="Ready")].status} {end}' \
            2>/dev/null | tr ' ' '\n' | grep -v '=True' | grep -v '^$' || true)"
          if [ -z "$not_ready" ]; then
            echo "all certificates Ready"
            exit 0
          fi
          echo "waiting for: ${not_ready}"
          sleep 10
        done
        echo "Timed out waiting for certificates: ${not_ready}" >&2
        exit 1
      args:
        executable: /bin/bash
      register: cert_wait
      changed_when: false
      failed_when: false

    - name: Проверить маршруты Traefik через локальный ingress
      ansible.builtin.shell: |
        curl --fail --silent --show-error --location --max-time 30 \
          --resolve {{ item.host }}:443:127.0.0.1 \
          {{ item.url | quote }}
      args:
        executable: /bin/bash
      loop: "{{ route_smoke_checks }}"
      register: route_smoke_status
      changed_when: false
      failed_when: false

    - name: Сохранить список неработающих публичных маршрутов
      ansible.builtin.set_fact:
        failed_route_smoke_checks: "{{ route_smoke_status.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"

    - name: Показать неработающие публичные маршруты
      when: failed_route_smoke_checks | length > 0
      ansible.builtin.debug:
        msg: "Route smoke check {{ item.item.name }} failed for {{ item.item.url }}: {{ item.stderr | default('') }}"
      loop: "{{ failed_route_smoke_checks }}"

    - name: Собрать диагностику ingress/TLS
      when: failed_route_smoke_checks | length > 0
      ansible.builtin.include_tasks: tasks/diagnose.yml

    - name: Завершить с ошибкой если публичные маршруты не отвечают
      when: failed_route_smoke_checks | length > 0
      ansible.builtin.fail:
        msg: "One or more Traefik HTTPS routes are not serving correctly; see diagnostics above"
