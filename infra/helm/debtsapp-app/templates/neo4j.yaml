apiVersion: v1
kind: Service
metadata:
  name: debts-neo4j
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: debts-neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: v1
kind: Service
metadata:
  name: debts-neo4j-headless
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app: debts-neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: debts-neo4j
  namespace: {{ .Values.namespace }}
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 10
  serviceName: debts-neo4j-headless
  replicas: 1
  selector:
    matchLabels:
      app: debts-neo4j
  template:
    metadata:
      labels:
        app: debts-neo4j
    spec:
      dnsPolicy: ClusterFirst
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 7474:7474 /data"]
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: data
              mountPath: /data
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7474
              name: http
              protocol: TCP
            - containerPort: 7687
              name: bolt
              protocol: TCP
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: debtsapp-env
                  key: NEO4J_AUTH
          startupProbe:
            tcpSocket:
              port: 7687
            failureThreshold: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 20
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 60
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: data
              mountPath: /data
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClassName | quote }}
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ .Values.neo4j.storageSize }}
